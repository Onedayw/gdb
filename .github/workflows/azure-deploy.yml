name: Deploy to Azure

# Builds the Next.js standalone server and deploys it to the gdb-site
# Azure Web App on every push to main. Signs in to Azure with OIDC.
# Required repository secrets:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   DATABASE_URL  - production Postgres (same value as gdb-site's app setting)
# Required repository variable (optional, falls back to the default below):
#   NEXT_PUBLIC_SITE_URL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://natewang.dev/gdb' }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The build prerenders every game page from the database, so the
      # schema and data must be in place first. The seed is idempotent.
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run build
      - name: Package standalone server
        run: |
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        id: deploy
        with:
          app-name: gdb-site
          package: .next/standalone
      - name: Restart gdb-site
        continue-on-error: true
        run: az webapp restart --ids "$(az webapp list --query "[?name=='gdb-site'].id" -o tsv)"
      # Fails the run if gdb-site isn't serving this commit, and prints how
      # many game links its home page lists.
      - name: Check the live build
        env:
          APP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          url="${APP_URL%/}/gdb"
          for i in $(seq 1 30); do
            build=$(curl -sL -o page.html -D - "$url" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-gdb-build"{print $2}' | tail -1)
            if [ "$build" = "$GITHUB_SHA" ]; then
              echo "gdb-site is serving $build"
              echo "Games listed on $url: $(grep -o '/gdb/games/[a-z0-9-]*' page.html | sort -u | wc -l)"
              exit 0
            fi
            echo "Attempt $i: serving '${build:-unknown}', want $GITHUB_SHA"
            sleep 10
          done
          echo "::error::gdb-site is not serving this build after 5 minutes"
          exit 1

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gdb
          POSTGRES_PASSWORD: gdb
          POSTGRES_DB: gdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gdb:gdb@localhost:5432/gdb?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The build prerenders every game page from the database.
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run build
